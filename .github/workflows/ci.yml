name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pairs trading/requirements.txt"
      - name: Install dependencies
        run: pip install -r "pairs trading/requirements.txt"
      - name: Run test suite
        working-directory: "pairs trading"
        run: pytest -q
